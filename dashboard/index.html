  <main>
    <section class="stats-row">
      <div class="stat-card"><span class="stat-val" id="stat-bottles">—</span><span class="stat-label">Bottles</span></div>
      <div class="stat-card"><span class="stat-val" id="stat-wines">—</span><span class="stat-label">Wines</span></div>
      <div class="stat-card"><span class="stat-val" id="stat-avg-score">—</span><span class="stat-label">Avg Score</span></div>
      <div class="stat-card"><span class="stat-val" id="stat-value">—</span><span class="stat-label">Cellar Value</span></div>
      <div class="stat-card"><span class="stat-val" id="stat-drinking-now">—</span><span class="stat-label">Drink Now</span></div>
    </section>

    <section class="controls">
      <input type="search" id="search" placeholder="Search wine, producer, region…" autocomplete="off" />
      <div class="type-filters" id="type-filters">
        <button class="filter-btn active" data-type="">All</button>
      </div>
      <div class="sort-secondary">
        <label>Sort
          <select id="sort-select">
            <option value="score_personal|desc">My Score ↓</option>
            <option value="score_community|desc">CT Score ↓</option>
            <option value="score_drinkability|desc">Drinkability ↓</option>
            <option value="vintage|desc">Vintage ↓</option>
            <option value="vintage|asc">Vintage ↑</option>
            <option value="drink_window_start|asc">Drink Window</option>
            <option value="price_paid|desc">Price ↓</option>
            <option value="wine_name|asc">Name A–Z</option>
            <option value="quantity|desc">Qty ↓</option>
          </select>
        </label>
      </div>
    </section>

    
  <section class="controls" style="margin-top:.5rem;padding:.5rem 1.5rem;">
    <button id="add-wine-btn" onclick="document.getElementById('add-modal').style.display='flex'"
      style="background:#C9A84C;color:#1a0a0a;border:none;padding:.6rem 1.4rem;border-radius:6px;font-weight:600;font-size:.95rem;cursor:pointer;">
      + Add Wine
    </button>
  </section>

  <!-- Add Wine Modal -->
  <div id="add-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;align-items:center;justify-content:center;">
    <div style="background:#2a1010;border:1px solid #C9A84C;border-radius:8px;padding:1.5rem;width:min(95vw,520px);max-height:90vh;overflow-y:auto;">
      <h2 style="color:#C9A84C;margin-bottom:1rem;">Add Wine</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
        <input id="f-name"     placeholder="Wine Name *"   style="grid-column:1/-1;background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-producer" placeholder="Producer"      style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-vintage"  placeholder="Vintage (year)" type="number" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-type"     placeholder="Type (Red/White/…)" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-variety"  placeholder="Variety"       style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-region"   placeholder="Region"        style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-subregion" placeholder="Sub-Region"   style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-qty"      placeholder="Quantity"      type="number" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-size"     placeholder="Bottle Size"   style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-location" placeholder="Location"      style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-bin"      placeholder="Bin"           style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-score"    placeholder="My Score"      type="number" step="0.1" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-ctScore"  placeholder="CT Score"      type="number" step="0.1" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-winStart" placeholder="Drink Window Start" type="number" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-winEnd"   placeholder="Drink Window End"   type="number" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-price"    placeholder="Price Paid"    type="number" step="0.01" style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-store"    placeholder="Store"         style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
        <input id="f-date"     placeholder="Purchase Date" type="date"   style="background:#341515;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem .75rem;border-radius:6px;width:100%;font-size:.9rem;">
      </div>
      <div style="display:flex;gap:.75rem;margin-top:1rem;justify-content:flex-end;">
        <button onclick="document.getElementById('add-modal').style.display='none'"
          style="background:transparent;color:#f0e6e6;border:1px solid #5a2a2a;padding:.5rem 1rem;border-radius:6px;cursor:pointer;">Cancel</button>
        <button id="save-wine-btn"
          style="background:#C9A84C;color:#1a0a0a;border:none;padding:.5rem 1.2rem;border-radius:6px;font-weight:600;cursor:pointer;">Save</button>
      </div>
      <div id="modal-msg" style="margin-top:.5rem;color:#4caf7d;font-size:.85rem;"></div>
    </div>
  </div>

        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>

<script>
document.getElementById('save-wine-btn').addEventListener('click', async () => {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('modal-msg').textContent='Wine Name is required'; return; }
  const row = {
    wine_name: name,
    producer: document.getElementById('f-producer').value||null,
    vintage: parseInt(document.getElementById('f-vintage').value)||null,
    wine_type: document.getElementById('f-type').value||null,
    variety: document.getElementById('f-variety').value||null,
    region: document.getElementById('f-region').value||null,
    sub_region: document.getElementById('f-subregion').value||null,
    quantity: parseInt(document.getElementById('f-qty').value)||null,
    bottle_size: document.getElementById('f-size').value||null,
    location: document.getElementById('f-location').value||null,
    bin: document.getElementById('f-bin').value||null,
    score_personal: parseFloat(document.getElementById('f-score').value)||null,
    score_community: parseFloat(document.getElementById('f-ctScore').value)||null,
    drink_window_start: parseInt(document.getElementById('f-winStart').value)||null,
    drink_window_end: parseInt(document.getElementById('f-winEnd').value)||null,
    price_paid: parseFloat(document.getElementById('f-price').value)||null,
    store: document.getElementById('f-store').value||null,
    purchase_date: document.getElementById('f-date').value||null,
  };
  const { error } = await db.from('wines').insert([row]);
  if (error) { document.getElementById('modal-msg').style.color='#e05050'; document.getElementById('modal-msg').textContent='Error: '+error.message; return; }
  document.getElementById('modal-msg').style.color='#4caf7d';
  document.getElementById('modal-msg').textContent='✅ Saved!';
  setTimeout(()=>{ document.getElementById('add-modal').style.display='none'; location.reload(); },1000);
});
</script>

</body>
</html>
